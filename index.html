<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #0a0a0f;
  --surface: #121218;
  --surface2: #1a1a24;
  --surface3: #22222e;
  --border: rgba(255,255,255,0.08);
  --border-hover: rgba(255,255,255,0.16);
  --accent: #c8a96e;
  --accent-dim: rgba(200,169,110,0.15);
  --text: #f0ede8;
  --text2: #9a9490;
  --text3: #5a5650;
  --radius: 12px;
  --transition: 0.2s cubic-bezier(0.4,0,0.2,1);
}

html { scroll-behavior: smooth; }

body {
  font-family: 'DM Sans', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  line-height: 1.5;
}

::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: var(--bg); }
::-webkit-scrollbar-thumb { background: var(--surface3); border-radius: 99px; }

header {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 16px 28px;
  border-bottom: 1px solid var(--border);
  background: rgba(10,10,15,0.9);
  backdrop-filter: blur(16px);
  position: sticky;
  top: 0;
  z-index: 100;
}

.logo-mark {
  width: 34px; height: 34px;
  background: linear-gradient(135deg, var(--accent), #9a6830);
  border-radius: 9px;
  display: flex; align-items: center; justify-content: center;
  font-size: 16px;
  flex-shrink: 0;
}

.logo-text h1 {
  font-family: 'Playfair Display', serif;
  font-size: 17px;
  font-weight: 700;
  letter-spacing: -0.2px;
}

.logo-text span {
  font-size: 10.5px;
  color: var(--accent);
  letter-spacing: 1.8px;
  text-transform: uppercase;
  font-weight: 500;
}

.app {
  display: grid;
  grid-template-columns: 380px 1fr;
  min-height: calc(100vh - 67px);
}

@media (max-width: 900px) {
  .app { grid-template-columns: 1fr; }
}

.panel {
  border-right: 1px solid var(--border);
  background: var(--surface);
  padding: 22px;
  display: flex;
  flex-direction: column;
  gap: 20px;
  overflow-y: auto;
}

.preview {
  padding: 32px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 20px;
  overflow-y: auto;
}

.field-group { display: flex; flex-direction: column; gap: 8px; }

label {
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.8px;
  text-transform: uppercase;
  color: var(--text2);
}

input[type="text"], textarea, select {
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  color: var(--text);
  font-family: 'DM Sans', sans-serif;
  font-size: 14px;
  padding: 10px 13px;
  transition: var(--transition);
  width: 100%;
  outline: none;
}

input[type="text"]:focus, textarea:focus, select:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-dim);
}

textarea { resize: vertical; min-height: 60px; font-size: 14px; line-height: 1.4; }
select option { background: var(--surface2); }

/* Sector selector */
.sector-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }

.sector-btn {
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  color: var(--text2);
  padding: 12px 6px;
  font-size: 11px;
  font-weight: 600;
  cursor: pointer;
  transition: var(--transition);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  text-align: center;
}

.sector-btn .icon { font-size: 20px; }
.sector-btn:hover { border-color: var(--border-hover); color: var(--text); }
.sector-btn.selected { border-color: var(--accent); background: var(--accent-dim); color: var(--accent); }

/* Position selector */
.position-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }

.pos-btn {
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  color: var(--text2);
  padding: 10px 6px;
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  transition: var(--transition);
}

.pos-btn:hover { border-color: var(--border-hover); color: var(--text); }
.pos-btn.selected { border-color: var(--accent); background: var(--accent-dim); color: var(--accent); }

/* Color swatches */
.color-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }

.swatch {
  width: 30px; height: 30px;
  border-radius: 50%;
  cursor: pointer;
  border: 2px solid transparent;
  transition: var(--transition);
  flex-shrink: 0;
}

.swatch.selected { border-color: var(--text); transform: scale(1.1); }

.color-custom {
  width: 30px; height: 30px;
  border-radius: 50%;
  border: 1px solid var(--border);
  cursor: pointer;
  padding: 0;
  overflow: hidden;
  background: none;
  flex-shrink: 0;
}
.color-custom::-webkit-color-swatch-wrapper { padding: 0; }
.color-custom::-webkit-color-swatch { border: none; border-radius: 50%; }

/* Drop zone */
.drop-zone {
  border: 1.5px dashed var(--border-hover);
  border-radius: var(--radius);
  padding: 22px 14px;
  text-align: center;
  cursor: pointer;
  transition: var(--transition);
  color: var(--text2);
  font-size: 12.5px;
}
.drop-zone:hover, .drop-zone.drag-over { border-color: var(--accent); background: var(--accent-dim); color: var(--text); }
.drop-zone .icon { font-size: 22px; display: block; margin-bottom: 6px; }

/* Buttons */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 10px 16px;
  border: none;
  border-radius: var(--radius);
  font-family: 'DM Sans', sans-serif;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  transition: var(--transition);
  width: 100%;
  letter-spacing: 0.2px;
}

.btn-primary {
  background: linear-gradient(135deg, var(--accent), #9a6830);
  color: #0a0a0f;
  padding: 14px;
  font-size: 14.5px;
}
.btn-primary:hover { filter: brightness(1.1); transform: translateY(-1px); }

.btn-ghost {
  background: transparent;
  border: 1px solid var(--border);
  color: var(--text2);
}
.btn-ghost:hover { border-color: var(--border-hover); color: var(--text); background: var(--surface2); }

.divider { height: 1px; background: var(--border); margin: 2px 0; }

/* Canvas preview */
.canvas-wrap {
  width: 100%;
  max-width: 320px;
  aspect-ratio: 9/16;
  border-radius: 18px;
  overflow: hidden;
  box-shadow: 0 8px 40px rgba(0,0,0,0.5);
  border: 1px solid var(--border);
}
#storyCanvas { width: 100%; height: 100%; display: block; }

.caption-box {
  width: 100%;
  max-width: 420px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 16px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.field-hint { font-size: 11px; color: var(--text3); }

.link-btn {
  background: none;
  border: none;
  color: var(--accent);
  font-size: 11.5px;
  font-weight: 600;
  cursor: pointer;
  text-align: left;
  padding: 2px 0;
  width: fit-content;
  text-decoration: underline;
  text-underline-offset: 2px;
}
.link-btn:hover { opacity: 0.8; }

/* Toast */
.toast-container { position: fixed; bottom: 20px; right: 20px; display: flex; flex-direction: column; gap: 8px; z-index: 999; }
.toast {
  background: var(--surface3);
  border: 1px solid var(--border-hover);
  border-radius: var(--radius);
  padding: 10px 16px;
  font-size: 13px;
  display: flex;
  align-items: center;
  gap: 8px;
  box-shadow: 0 4px 20px rgba(0,0,0,0.4);
}
.toast.success { border-color: rgba(85,184,122,0.4); color: #55b87a; }
.toast.error { border-color: rgba(224,85,85,0.4); color: #e05555; }
.toast.info { border-color: rgba(85,144,224,0.4); color: #5590e0; }
</style>
</head>

      <button class="btn btn-ghost" onclick="copyCaption()">📋 Copiar caption</button>

function buildSectorGrid() {
  const grid = document.getElementById('sectorGrid');
  grid.innerHTML = Object.entries(SECTORES).map(([key, r]) => `
    <button class="sector-btn ${key === state.sector ? 'selected' : ''}" data-sector="${key}">
      <span class="icon">${r.icon}</span>${r.label}
    </button>
  `).join('');
  grid.querySelectorAll('.sector-btn').forEach(btn => {
    btn.addEventListener('click', () => selectSector(btn.dataset.sector));
  });
}

function selectSector(key, opts = {}) {
  state.sector = key;
  state.accentColor = SECTORES[key].accent;
  document.querySelectorAll('.sector-btn').forEach(b => b.classList.toggle('selected', b.dataset.sector === key));
  document.querySelectorAll('.swatch').forEach(s => s.classList.toggle('selected', s.dataset.color.toLowerCase() === state.accentColor.toLowerCase()));
  if (!opts.silent) renderCanvas();
}

// Detección del sector a partir de texto libre, sin IA: coincidencia por palabras clave.
// Se queda con la palabra clave más específica (más larga), no la primera que aparezca,
// para evitar falsos positivos como "peluquería canina" -> Belleza en vez de Mascotas.
function detectSector(text) {
  const t = text.toLowerCase().trim();
  if (!t) return null;
  let best = null, bestLen = 0;
  for (const [key, r] of Object.entries(SECTORES)) {
    if (!r.keywords) continue;
    for (const k of r.keywords) {
      if (t.includes(k) && k.length > bestLen) {
        best = key;
        bestLen = k.length;
      }
    }
  }
  return best;
}

let detectTimeout = null;
document.getElementById('sectorText').addEventListener('input', e => {
  clearTimeout(detectTimeout);
  const text = e.target.value;
  detectTimeout = setTimeout(() => {
    const hint = document.getElementById('sectorHint');
    if (!text.trim()) {
      hint.textContent = 'Escribe tu actividad y elegimos el estilo de frases por ti.';
      return;
    }
    const match = detectSector(text);
    if (match) {
      selectSector(match);
      hint.textContent = `Detectado: ${SECTORES[match].label} ✓`;
    } else {
      selectSector('general');
      hint.textContent = 'No encontramos una categoría exacta — usando frases generales.';
      sectorGridEl.style.display = 'grid';
      document.getElementById('toggleSectorGrid').textContent = 'Ocultar la lista';

});

  e.preventDefault();

});

function handlePhotoFile(file) {
  const reader = new FileReader();
  reader.onload = e => {
    const img = new Image();
    img.onload = () => {
      state.photoImg = img;
      dropZone.innerHTML = `<span class="icon">✓</span>Foto cargada · toca para cambiarla`;
      renderCanvas();
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

// ─── BANCO DE FRASES: SELECCIÓN SIN REPETIR ────────────────────────────────
function pickFromBank(type) {
  const arr = SECTORES[state.sector][type];
  const usedKey = state.sector + ':' + type;
  if (!state.usedIndices[usedKey]) state.usedIndices[usedKey] = [];
  let used = state.usedIndices[usedKey];
  if (used.length >= arr.length) used = [];
  let idx;
  do { idx = Math.floor(Math.random() * arr.length); } while (used.includes(idx));
  used.push(idx);
  state.usedIndices[usedKey] = used;
  return arr[idx];
}

function fillTemplate(str) {
  const name = document.getElementById('businessName').value.trim() || 'tu negocio';
  return str.replace(/\{negocio\}/g, name);
}

function generateAuto() {
  const main = fillTemplate(pickFromBank('openers'));
  const footer = fillTemplate(pickFromBank('footers'));
  const caption = fillTemplate(pickFromBank('captions'));
  document.getElementById('mainPhrase').value = main;
  document.getElementById('footerPhrase').value = footer;
  document.getElementById('captionText').value = caption;
  renderCanvas();
  toast('Publicación de hoy lista ✦', 'success');
}

// ─── DIBUJO DEL CANVAS ──────────────────────────────────────────────────────
function hexToRgb(hex) {
  hex = hex.replace('#', '');
  if (hex.length === 3) hex = hex.split('').map(c => c + c).join('');
  const num = parseInt(hex, 16);
  return { r: (num >> 16) & 255, g: (num >> 8) & 255, b: num & 255 };
}
function hexToRgba(hex, alpha) {
  const { r, g, b } = hexToRgb(hex);
  return `rgba(${r},${g},${b},${alpha})`;
}
function getContrastText(hex) {
  const { r, g, b } = hexToRgb(hex);
  const luminance = (0.299 * r + 0.587 * g + 0.114 * b) / 255;
  return luminance > 0.6 ? '#0a0a0f' : '#ffffff';
}

function wrapLines(ctx, text, maxWidth) {
  const words = text.split(' ');
  const lines = [];
  let current = '';
  words.forEach(word => {
    const test = current ? current + ' ' + word : word;
    if (ctx.measureText(test).width > maxWidth && current) {
      lines.push(current);
      current = word;
    } else {
      current = test;
    }
  });
  if (current) lines.push(current);
  return lines;
}

function drawBackground(ctx, W, H) {
  if (state.photoImg) {
    const img = state.photoImg;
    const imgRatio = img.width / img.height;
    const canvasRatio = W / H;
    let sw, sh, sx, sy;
    if (imgRatio > canvasRatio) {
      sh = img.height; sw = sh * canvasRatio; sx = (img.width - sw) / 2; sy = 0;
    } else {
      sw = img.width; sh = sw / canvasRatio; sx = 0; sy = (img.height - sh) / 2;
    }
    ctx.drawImage(img, sx, sy, sw, sh, 0, 0, W, H);
  } else {
    ctx.fillStyle = '#1a1a24';
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#3a3a48';
    ctx.font = '80px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('📷', W / 2, H / 2 - 20);
    ctx.fillStyle = '#5a5650';
    ctx.font = "500 32px 'DM Sans', sans-serif";
    ctx.fillText('Sube tu foto para comenzar', W / 2, H / 2 + 60);
  }
}

function renderCanvas() {
  const canvas = document.getElementById('storyCanvas');
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;
  const accent = state.accentColor;

  ctx.clearRect(0, 0, W, H);
  drawBackground(ctx, W, H);

  // Tinte general con el color elegido, para que la foto "vaya acorde"
  ctx.fillStyle = hexToRgba(accent, 0.14);
  ctx.fillRect(0, 0, W, H);

  const mainPhrase = document.getElementById('mainPhrase').value.trim();
  const footerPhrase = document.getElementById('footerPhrase').value.trim();

  // Zonas según posición elegida
  const zones = { top: H * 0.16, middle: H * 0.5, bottom: H * 0.7 };
  const mainY = zones[state.position];

  // Fuente del texto principal
  let fontCss, fontWeight, fontStyle;
  if (state.fontKey === 'auto') {
    const r = SECTORES[state.sector];
    fontCss = r.font; fontWeight = r.fontWeight; fontStyle = r.fontStyle;
  } else {
    const f = FONT_OPTIONS.find(f => f.key === state.fontKey);
    fontCss = f.css; fontWeight = f.weight; fontStyle = f.style;
  }

  const fontSize = 62;
  ctx.font = `${fontStyle === 'italic' ? 'italic ' : ''}${fontWeight} ${fontSize}px ${fontCss}`;
  const maxWidth = W * 0.82;
  const lines = mainPhrase ? wrapLines(ctx, mainPhrase, maxWidth) : [];
  const lineHeight = fontSize * 1.18;
  const blockHeight = lines.length * lineHeight;

  if (lines.length) {
    // Fondo oscuro degradado detrás del texto principal para legibilidad
    const gradTop = mainY - blockHeight / 2 - 60;
    const gradBottom = mainY + blockHeight / 2 + 60;
    const grad = ctx.createLinearGradient(0, gradTop, 0, gradBottom);
    grad.addColorStop(0, 'rgba(0,0,0,0)');
    grad.addColorStop(0.3, hexToRgba(accent, 0.25));
    grad.addColorStop(0.5, 'rgba(0,0,0,0.55)');
    grad.addColorStop(0.7, hexToRgba(accent, 0.25));
    grad.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = grad;
    ctx.fillRect(0, Math.max(0, gradTop), W, Math.min(H, gradBottom) - Math.max(0, gradTop));

    ctx.fillStyle = '#ffffff';
    ctx.textAlign = 'center';
    ctx.shadowColor = 'rgba(0,0,0,0.6)';
    ctx.shadowBlur = 18;
    let startY = mainY - blockHeight / 2 + fontSize * 0.75;
    lines.forEach(line => {
      ctx.fillText(line, W / 2, startY);
      startY += lineHeight;
    });
    ctx.shadowBlur = 0;
  }

  // Barra de pie con la frase fija
  if (footerPhrase) {
    const barTop = H * 0.87;
    ctx.fillStyle = hexToRgba(accent, 0.92);
    ctx.fillRect(0, barTop, W, H - barTop);
    ctx.fillStyle = getContrastText(accent);
    ctx.font = "700 34px 'DM Sans', sans-serif";
    ctx.textAlign = 'center';
    const footerLines = wrapLines(ctx, footerPhrase, W * 0.86);
    const footerLineHeight = 42;
    let fy = barTop + (H - barTop) / 2 - ((footerLines.length - 1) * footerLineHeight) / 2 + 12;
    footerLines.forEach(line => { ctx.fillText(line, W / 2, fy); fy += footerLineHeight; });
  }

  // Marco decorativo en el color elegido
  const pad = 34;
  ctx.strokeStyle = accent;
  ctx.lineWidth = 6;
  ctx.globalAlpha = 0.85;
  ctx.strokeRect(pad, pad, W - pad * 2, H - pad * 2);
  ctx.globalAlpha = 1;
}

function exportPNG() {
  renderCanvas();
  const canvas = document.getElementById('storyCanvas');
  const name = (document.getElementById('businessName').value || 'publicacion').trim().replace(/\s+/g, '-').toLowerCase();
  const link = document.createElement('a');
  link.download = `${name}-${Date.now()}.png`;
  link.href = canvas.toDataURL('image/png');
  link.click();
  toast('Imagen descargada', 'success');
}

function copyCaption() {
  const text = document.getElementById('captionText').value;
  if (!text) { toast('Todavía no hay caption para copiar', 'info'); return; }
  navigator.clipboard.writeText(text).then(() => toast('Caption copiado al portapapeles', 'success'));
}

// ─── TOAST ──────────────────────────────────────────────────────────────────
function toast(msg, type = 'info') {
  const icons = { success: '✓', error: '✕', info: 'ℹ' };
  const container = document.getElementById('toastContainer');
  const el = document.createElement('div');
  el.className = `toast ${type}`;
  el.innerHTML = `<span>${icons[type] || 'ℹ'}</span><span>${msg}</span>`;
  container.appendChild(el);
  setTimeout(() => { el.style.opacity = '0'; el.style.transform = 'translateX(120%)'; el.style.transition = '0.3s'; setTimeout(() => el.remove(), 300); }, 3000);
}
